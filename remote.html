<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#10242c">
  <title>Minimalflächen – Fernbedienung</title>
  <link rel="stylesheet" href="remote.css">
</head>
<body>
  <main class="remote-controller">
    <header>
      <span class="connection-dot" aria-hidden="true"></span>
      <div><h1>Minimalflächen</h1><p id="connection-status">Verbindung wird aufgebaut …</p></div>
    </header>
    <section id="touchpad" class="touchpad" aria-label="Touchfläche zum Drehen, Zoomen und Verschieben">
      <span>Zum Drehen ziehen</span>
      <small>Zwei Finger: zoomen oder verschieben</small>
    </section>
    <section class="button-grid" aria-label="Steuerung">
      <button data-command="surface" data-direction="-1">‹ Fläche</button>
      <button data-command="surface" data-direction="1">Fläche ›</button>
      <button data-command="material" data-direction="1">Material</button>
      <button data-command="background" data-direction="1">Hintergrund</button>
      <button data-command="rotation" class="accent">▶︎ / ❚❚</button>
      <button data-command="reset">Ansicht zurück</button>
      <button id="motion-toggle" class="motion-toggle" type="button" aria-pressed="false">Sensorsteuerung einschalten</button>
      <p id="motion-status" class="motion-status">Smartphone neigen, um die Fläche zu drehen.</p>
    </section>
  </main>
  <script type="module" src="remote.js"></script>
</body>
</html>
